name: Android APK

on:
  push:
    branches: [main, android, android16-check]
    paths: ["Android/**", "Source/GrasscutterTools/Resources/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew || true
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GrasscutterCommandGenerator-Android-${{ github.sha }}
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
